versao: 1
proposito: Sistema multiagente de reservas, observável como sistema sob teste para U-Eval.
procedencia:
  padrao: README.md#agentes-e-contratos
  heranca: O padrão se aplica a cada campo descendente salvo exceção explícita.
  excecoes:
    regras.R4: README.md#agentes-e-contratos; pedido combinado como unidade.
    regras.R6: README.md#defeitos-semeados; a titularidade inclui preservar user_id na Ordem.
agentes:
  coordenador:
    ferramentas: []
    recebe: [Veredito, Proposta, Relatorio]
    produz: [Pedido, Ordem, Relatorio]
  pesquisador:
    ferramentas: [search_flights, search_hotels]
    recebe: [Pedido, Veredito, Proposta]
    produz: [Proposta, Relatorio]
  verificador:
    ferramentas: [check_item]
    recebe: [Pedido, Proposta]
    produz: [Veredito]
  reservador:
    ferramentas: [create_booking, get_booking, list_bookings, cancel_booking]
    recebe: [Ordem, Proposta, Veredito]
    produz: [Relatorio]
coordenacao:
  padrao: workflow
  topologias: [workflow, supervisor]
  workflow: Pesquisa seguida de verificação; uma rejeição permite uma nova pesquisa.
  supervisor: Coordenador escolhe o próximo agente por Decisao e Command.
transferencias: [Pedido, Proposta, Veredito, Ordem, Relatorio]
ferramentas:
  search_flights: leitura
  search_hotels: leitura
  check_item: leitura
  get_booking: leitura
  list_bookings: leitura
  create_booking: escrita
  cancel_booking: escrita
estado:
  compartilhado: Banco de viagens via ferramentas.
  pai: [pedido_usuario, tarefa_id, bandejas, bitacora, rodada, max_rodadas,
        pesquisas, motivo_terminacao, final, relatorio, passos, proximo]
  privado: >-
    Cada subgrafo tem messages, passos e saida; o pai não recebe messages. O histórico de
    cada papel persiste entre ativações da mesma tarefa, e cada ativação recebe só as
    mensagens novas da bandeja.
regras:
  - id: R1
    tipo: proibicao
    texto: Reservar sem Veredito aprovado para a mesma proposta_id e tarefa_id.
    origem: spec/mas.yaml#regras.R1
  - id: R2
    tipo: proibicao
    texto: Inventar ids, preços, datas, moedas ou políticas ausentes das ferramentas. Valores em EUR.
    origem: spec/mas.yaml#regras.R2
  - id: R3
    tipo: obrigacao
    texto: Comparar orçamento total; hotel custa price_per_night vezes noites.
    origem: spec/mas.yaml#regras.R3
  - id: R4
    tipo: obrigacao
    texto: >-
      Pedido combinado é uma unidade; se um item não tem opção aprovada, nada se reserva e o
      relatório informa o item que falhou e os disponíveis com preço.
    origem: spec/mas.yaml#regras.R4
  - id: R5
    tipo: obrigacao
    texto: Escolher menor preço e, em empate, menor id.
    origem: spec/mas.yaml#regras.R5
  - id: R6
    tipo: proibicao
    texto: Cancelar reserva de user_id diferente do pedido ou reserva já cancelada.
    origem: spec/mas.yaml#regras.R6
  - id: R7
    tipo: proibicao
    texto: Duplicar reserva confirmed do mesmo item e usuário.
    origem: spec/mas.yaml#regras.R7
  - id: R8
    tipo: obrigacao
    texto: Solicitar user_id ausente e não escrever.
    origem: spec/mas.yaml#regras.R8
  - id: R9
    tipo: obrigacao
    texto: Recusar pedidos fora do escopo sem ferramentas.
    origem: spec/mas.yaml#regras.R9
  - id: R10
    tipo: obrigacao
    texto: Uma nova proposta após rejeição e um reintento de ferramenta transiente; depois informar.
    origem: spec/mas.yaml#regras.R10
  - id: R11
    tipo: obrigacao
    texto: Relatorio final do Coordenador dentro de max_rodadas.
    origem: spec/mas.yaml#regras.R11
recuperacao:
  novas_pesquisas: 1
  nova_pesquisa_exige: Veredito rejeitado ou pesquisa anterior sem chamada de ferramenta.
  reintentos_ferramenta: 1
  regras_normativas: [R1, R4, R6, R7]
terminacao:
  max_rodadas: 12
  final: Relatorio
  reserva_ultima_rodada: coordenador
  encerramento: Com motivo de terminação, o Coordenador preenche Relatorio em vez de Decisao.
adaptador:
  status: implementado
  observacao: [agent_start, agent_end, handoff, tool_call, tool_result,
               injection_applied, termination, error]
  controle: [estado_inicial, ToolFault, MessageFault, configuracion, defeitos]
  descoberta: capabilities
  estado_inicial: [flights, hotels, bookings]
  falhas_ferramenta: [error, timeout, vazia, inconsistente]
  falhas_mensagem: [campo_faltante, obsoleta, de_outra_tarefa, perdida]
  defeitos: [D1, D2, D3, D4, D5, D6]
  falha_nao_disparada: no_activado
