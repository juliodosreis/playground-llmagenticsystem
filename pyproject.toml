[project]
name = "travel-mas"
version = "0.1.0"
description = "Playground do caso de reservas de viagem do curso de agentes com LLMs, em LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
google = ["langchain-google-genai>=4.0"]
dev = ["pytest>=8.0"]
studio = ["langgraph-cli[inmem]>=0.1"]

[project.scripts]
travel-mas = "travel_mas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_mas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
